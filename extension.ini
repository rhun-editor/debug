# Debuggers for rhun: Delve (Go), debugpy (Python) and lldb-dap (C, C++). rhun speaks the Debug
# Adapter Protocol to the adapters itself; this program only prepares Go and Python launches.
name = debug
owner = rhun-editor
title = Debug
description = Debug Go with Delve, Python with debugpy, and C and C++ with lldb-dap.
icon = icon.png
color = #c0392b
version = 0.1.1
protocol = 1
run.linux-x86_64 = bin/debug-linux-x86_64
run.macos-arm64 = bin/debug-macos-arm64
run.windows-x64 = bin/debug-windows-x64.exe
on = command

[commands]
install_delve = Debug: Install Delve
install_debugpy = Debug: Install debugpy

[needs]
debug = yes
documents = read
project = read
terminal = yes

[debugger.go]
title = Go (Delve)
languages = Go
program = dlv
program.windows-x64 = dlv.exe
paths = ~/go/bin
args = dap --listen=127.0.0.1:${port}
transport = tcp
resolve = yes
templates = debug/go.ini
install = go install github.com/go-delve/delve/cmd/dlv@latest
attr.mode = choice debug test exec core replay remote local
attr.program = path
attr.args = list
attr.buildFlags = list
attr.env = map
attr.cwd = path
attr.stopOnEntry = bool
attr.processId = int

[debugger.python]
title = Python (debugpy)
languages = Python
program = ${config:python|python3}
args = -m debugpy.adapter
resolve = yes
templates = debug/python.ini
install = python3 -m pip install debugpy
attr.program = path
attr.module = string
attr.args = list
attr.cwd = path
attr.env = map
attr.python = path
attr.stopOnEntry = bool
attr.justMyCode = bool
attr.console = choice internalConsole integratedTerminal externalTerminal

[debugger.c]
title = C and C++ (lldb-dap)
languages = C C++
program = lldb-dap lldb-dap-20 lldb-dap-19 lldb-dap-18
program.macos-arm64 = xcrun
args.macos-arm64 = lldb-dap
templates = debug/c.ini
install = xcode-select --install
attr.program = path
attr.args = list
attr.cwd = path
attr.env = map
attr.stopOnEntry = bool
attr.pid = int
