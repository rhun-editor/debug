# Go (Delve). Add a section to PROJECT/.rhun/launch.ini; the extension fills in what is missing.
[Launch package]
type = go
mode = debug
program = ${fileDir}

[Launch file]
type = go
mode = debug
program = ${file}

[Test package]
type = go
mode = test
program = ${fileDir}

[Test at cursor]
type = go
mode = test
program = ${fileDir}
testAtCursor = yes
